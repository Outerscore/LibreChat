name: Deploy LibreChat to Staging

# Deploys the Outerscore LibreChat fork to the internal STAGING environment
# (staging.outerscore.com — the Hetzner box, same host as test).
#
# Twin of deploy-test.yml. Differences: builds with the staging parent origin,
# pushes a `librechat-staging` image, deploys to /opt/librechat-staging, reads
# the `staging` GitHub Environment's secrets, and runs the staging compose file.
#
# Triggers:
#   • workflow_dispatch → build & deploy any branch (default dev — the fork's code
#     lives on dev; staging differs only by parent origin + runtime env + port).
#   • push to `staging`  → if you maintain a staging branch, redeploy on merge.
#
# IMPORTANT: for any auto-deploy to run unattended, the `staging` GitHub
# Environment must NOT have "required reviewers".

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or ref to build and deploy"
        required: true
        default: "dev"
  push:
    branches: [staging]

concurrency:
  group: librechat-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PARENT_ORIGIN: https://staging.outerscore.com
  # workflow_dispatch → the chosen branch; push → the pushed branch (staging)
  DEPLOY_REF: ${{ github.event.inputs.branch || github.ref_name }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout ${{ env.DEPLOY_REF }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        run: |
          set -euo pipefail
          OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          SAFE_BRANCH="$(printf '%s' "${DEPLOY_REF}" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          IMAGE="${REGISTRY}/${OWNER_LC}/librechat-staging:${SAFE_BRANCH}-${GITHUB_SHA::8}"
          LATEST="${REGISTRY}/${OWNER_LC}/librechat-staging:staging-latest"
          echo "Building ${IMAGE}"
          docker build \
            --build-arg VITE_OUTERSCORE_PARENT_ORIGIN="${PARENT_ORIGIN}" \
            -t "${IMAGE}" -t "${LATEST}" .
          docker push "${IMAGE}"
          docker push "${LATEST}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to staging host
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout ${{ env.DEPLOY_REF }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Copy compose + config to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.staging.yml,librechat.staging.yaml"
          target: "/opt/librechat-staging"
          overwrite: true

      - name: Write .env, pull image, restart stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.LIBRECHAT_STAGING_ENV }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_FILE,IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/librechat-staging
            umask 077
            printf '%s\n' "$ENV_FILE" > .env
            sed -i '/^LIBRECHAT_IMAGE=/d' .env
            echo "LIBRECHAT_IMAGE=$IMAGE" >> .env
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker compose -f docker-compose.staging.yml up -d
            docker logout ghcr.io || true
            docker image prune -f
